<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">英超每日观察头像</title>
  <desc id="desc">深海军蓝圆形徽章，中央为足球、广播声波和日出元素，底部为英超每日观察中文标题。</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="36%" r="72%">
      <stop offset="0" stop-color="#173e73"/>
      <stop offset="0.62" stop-color="#0b2348"/>
      <stop offset="1" stop-color="#06142f"/>
    </radialGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5d4a"/>
      <stop offset="1" stop-color="#c82735"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffe49a"/>
      <stop offset="0.5" stop-color="#f6c85f"/>
      <stop offset="1" stop-color="#d99b32"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#020a1b" flood-opacity="0.48"/>
    </filter>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="badgeClip"><circle cx="512" cy="512" r="478"/></clipPath>
  </defs>

  <circle cx="512" cy="512" r="493" fill="#030d22"/>
  <circle cx="512" cy="512" r="478" fill="url(#bg)" stroke="#f6c85f" stroke-width="8"/>
  <g clip-path="url(#badgeClip)">
    <circle cx="512" cy="512" r="390" fill="none" stroke="#2a5b92" stroke-width="2" opacity="0.5"/>
    <circle cx="512" cy="512" r="430" fill="none" stroke="#2a5b92" stroke-width="2" stroke-dasharray="2 18" opacity="0.7"/>

    <path d="M205 382 A345 345 0 0 1 819 382" fill="none" stroke="url(#gold)" stroke-width="10" stroke-linecap="round" opacity="0.92"/>
    <path d="M273 343 A276 276 0 0 1 751 343" fill="none" stroke="#e9473f" stroke-width="7" stroke-linecap="round" opacity="0.82"/>
    <g fill="#f6c85f" opacity="0.92">
      <circle cx="257" cy="351" r="5"/><circle cx="767" cy="351" r="5"/>
      <circle cx="218" cy="393" r="4"/><circle cx="806" cy="393" r="4"/>
    </g>

    <g transform="translate(512 467)" filter="url(#shadow)">
      <circle r="151" fill="#f7f4ec" stroke="#f6c85f" stroke-width="10"/>
      <circle r="139" fill="none" stroke="#d8e5f3" stroke-width="3"/>
      <path d="M0-57 L54-18 L33 47 L-33 47 L-54-18 Z" fill="#0b2348"/>
      <path d="M0-57 L0-112 M54-18 L112-35 M33 47 L69 93 M-33 47 L-69 93 M-54-18 L-112-35" fill="none" stroke="#0b2348" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M0-57 L0-112 M54-18 L112-35 M33 47 L69 93 M-33 47 L-69 93 M-54-18 L-112-35" fill="none" stroke="#f7f4ec" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <circle r="22" fill="#e9473f"/>
      <path d="M-12-15 L11-15 L18 5 L0 19 L-18 5 Z" fill="#f7f4ec" opacity="0.96"/>
    </g>

    <g fill="none" stroke="url(#gold)" stroke-linecap="round" filter="url(#softGlow)">
      <path d="M294 492 C246 514 246 572 294 594" stroke-width="11"/>
      <path d="M250 454 C171 498 171 588 250 632" stroke-width="9" opacity="0.88"/>
      <path d="M730 492 C778 514 778 572 730 594" stroke-width="11"/>
      <path d="M774 454 C853 498 853 588 774 632" stroke-width="9" opacity="0.88"/>
    </g>

    <path d="M0 734 Q236 666 512 724 T1024 734 V1024 H0Z" fill="#071a3a" opacity="0.92"/>
    <path d="M0 757 Q255 696 512 748 T1024 757" fill="none" stroke="#e9473f" stroke-width="5" opacity="0.72"/>
    <path d="M0 778 Q257 717 512 769 T1024 778" fill="none" stroke="#f6c85f" stroke-width="3" opacity="0.76"/>
  </g>

  <g text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif">
    <text x="512" y="814" fill="#f7f4ec" font-size="74" font-weight="800" letter-spacing="5">英超每日观察</text>
    <text x="512" y="872" fill="#f6c85f" font-size="25" font-weight="700" letter-spacing="10">NEWS · ANALYSIS · DAILY</text>
  </g>
  <circle cx="512" cy="512" r="478" fill="none" stroke="#f6c85f" stroke-width="8"/>
</svg>
